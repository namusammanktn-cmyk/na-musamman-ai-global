
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06163d">
  <title>NA MUSAMMAN AI GLOBAL</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app-shell">

    <header class="topbar">

      <div class="brand">

        <div class="logo">N</div>

        <div>
          <div class="brand-name">
            NA MUSAMMAN <span>AI</span>
          </div>

          <div class="brand-sub">
            GLOBAL
          </div>
        </div>

      </div>

      <div class="status-pill">
        <span class="dot"></span>
        <span id="statusText">AI READY</span>
      </div>

    </header>


    <main class="main">

      <section class="hero">

        <p class="eyebrow">
          ✦ AI ASSISTANT
        </p>

        <h1>
          Welcome to<br>
          <span>NA MUSAMMAN AI GLOBAL</span>
        </h1>

        <p class="hero-text">
          Ask anything — writing, translation, school work,
          content creation, summaries, and more.
        </p>

      </section>


      <section class="quick-actions">

        <button data-prompt="Write a strong Facebook caption about this news:">
          📰
          <b>News</b>
          <small>Write news</small>
        </button>

        <button data-prompt="Translate this text to simple Hausa:">
          🌐
          <b>Translate</b>
          <small>Translate text</small>
        </button>

        <button data-prompt="Summarize this text clearly:">
          ✦
          <b>Summarize</b>
          <small>Make a summary</small>
        </button>

        <button data-prompt="Help me with this school assignment:">
          🎓
          <b>Study</b>
          <small>Study assistant</small>
        </button>

      </section>


      <section class="chat-card">

        <div id="chat" class="chat">

          <div class="message assistant">

            <div class="avatar">
              N
            </div>

            <div class="bubble">
              Hello! 👋 I am
              <b>NA MUSAMMAN AI GLOBAL</b>.
              How can I help you today?
            </div>

          </div>

        </div>


        <div class="composer">

          <textarea
            id="message"
            rows="1"
            placeholder="Type your message..."
          ></textarea>


          <button
            id="mic"
            class="voice"
            title="Speak"
          >
            🎙️
          </button>


          <button
            id="send"
            class="send"
            title="Send"
          >
            ➤
          </button>

        </div>


        <div class="composer-note">
          NA MUSAMMAN AI GLOBAL • AI Assistant
        </div>

      </section>

    </main>

  </div>


  <script src="/app.js"></script>

</body>
</html>
